<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">


  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LinkSpec - Domain-Gated Professional Networking App">

  <!-- Google Identity Services: Client ID for GIS button-based sign-in -->
  <meta name="google-signin-client_id"
        content="761906978717-tvdv5e4ju6tdc4i12u8e5sepuvhsegla.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="linkspec_app">
  <link rel="apple-touch-icon" href="icons/apply_wizz_logo.jpg">


  <!-- Favicon -->
  <link rel="icon" type="image/jpg" href="icons/apply_wizz_logo.jpg"/>


  <title>LinkSpec</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Identity Services (GIS) — latest, non-deprecated button-based flow.
    Do NOT use the old platform.js library.
    This must be loaded in <head> so the renderButton API is available
    when Flutter's HtmlElementView mounts.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    /**
     * GIS credential callback bridge.
     * GIS calls this function with a CredentialResponse when the user picks
     * a Google account.  We forward the raw JWT id_token to Flutter via a
     * window-level hook that the Dart side registers.
     */
    function onGoogleCredentialResponse(response) {
      if (window.flutterGoogleSignInCallback) {
        window.flutterGoogleSignInCallback(response.credential);
      } else {
        console.warn('LinkSpec: flutterGoogleSignInCallback not yet registered.');
      }
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
